<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Курс валют</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        margin: 0;
        padding: 30px;
    }

    h1 {
        text-align: center;
    }

    .converter,
    .block {
        background: white;
        max-width: 900px;
        margin: 20px auto;
        padding: 20px;
        border-radius: 10px;
    }

    .converter {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    input,
    select,
    button {
        padding: 10px;
        font-size: 16px;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th,
    td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: left;
    }

    th {
        background: #eee;
    }

    #result {
        text-align: center;
    }

    #status {
        text-align: center;
        color: #555;
    }

    </style>
</head>
<body>

    <h1>Курс валют</h1>

    <div class="converter">
        <h2>Конвертер</h2>

        <input type="number" id="amount" value="1">

        <select id="from"></select>

        <select id="to"></select>

        <button onclick="convert()">Конвертувати</button>

        <h3 id="result">Результат</h3>
    </div>

    <div class="block">
        <h2>Традиційні валюти</h2>

        <table>
            <thead>
                <tr>
                    <th>Валюта</th>
                    <th>Курс до USD</th>
                </tr>
            </thead>

            <tbody id="currencyTable"></tbody>
        </table>
    </div>

    <div class="block">
        <h2>Криптовалюти</h2>

        <table>
            <thead>
                <tr>
                    <th>Назва</th>
                    <th>Ціна USD</th>
                </tr>
            </thead>

            <tbody id="cryptoTable"></tbody>
        </table>
    </div>

    <p id="status"></p>

    <script src="script.js"></script>
</body>
</html>
