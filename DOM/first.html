<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
        font-family: Arial, sans-serif;
    }

    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
    }

    .modal-content {
        width: 300px;
        margin: 150px auto;
        padding: 20px;
        background: white;
        text-align: center;
        border-radius: 8px;
    }

    button {
        padding: 10px 20px;
        cursor: pointer;
    }
</style>
</head>
<body>
    <button id="openBtn">Відкрити</button>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>Привіт з модального вікна!</h2>
            <button id="closeBtn">Закрити</button>
        </div>
    </div>
    <script src="DOM.js"></script>
</body>
</html>
