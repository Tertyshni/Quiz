<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f5fa;
    transition:.3s;
}

.container{
    width:90%;
    max-width:900px;
    margin:40px auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

h1{
    color:#333;
}

form{
    display:flex;
    flex-direction:column;
    gap:15px;

    background:white;
    padding:20px;

    border-radius:15px;

    box-shadow:0 0 15px rgba(0,0,0,.1);
}

input,
textarea{

    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}

textarea{
    resize:vertical;
    min-height:100px;
}

button{
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#0077ff;
    color:white;
    font-size:16px;
}

button:hover{
    background:#005dd1;
}

#tasks{
    margin-top:30px;
}

.task{

    background:white;
    border-left:6px solid royalblue;
    margin-bottom:20px;
    padding:18px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.08);
}

.task h2{
    margin-bottom:10px;
}

.task p{
    margin:6px 0;
}

.dark{
    background:#181818;
    color:white;
}

.dark form,
.dark .task{
    background:#2b2b2b;
    color:white;
}

.dark input,
.dark textarea{
    background:#444;
    color:white;
    border:1px solid #777;
}

.dark h1{
    color:white;
}

.dark button{
    background:#5a8cff;
}
    </style>
</head>
<body>
    <div class="container">

    <div class="header">
        <h1>Менеджер задач</h1>

        <button id="themeBtn">
             Темна тема
        </button>
    </div>

    <form id="taskForm">

        <input type="text" id="title" placeholder="Назва задачі" required>

        <textarea id="description" placeholder="Опис задачі"></textarea>

        <label>Дедлайн</label>

        <input type="date" id="deadline">

        <label>Дата створення</label>

        <input type="date" id="created">

        <button type="submit">
            Додати задачу
        </button>

    </form>

    <div id="tasks"></div>

</div>

<script src="script.js"></script>
</body>
</html>
